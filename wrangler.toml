# www.greenfielddemo.com — Vite static site served as Worker static assets.
# `npm run build` writes the site to dist/.
# worker/index.js only handles POST /api/event (Plausible proxy); everything else is assets.
name = "www-greenfielddemo-com"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/event"]

# Until the custom domain is attached the worker is reachable on workers.dev only.
# At cutover, restore:
# [[routes]]
# pattern = "www.greenfielddemo.com"
# custom_domain = true
workers_dev = true
